name: REminiSCENT UI42 integrated active bars
on:
  pull_request:
    paths:
      - 'REMINISCENT_MPC/LAB23/skins/TUI.json'
      - 'REMINISCENT_MPC/LAB23/tests/test_ui42_integrated_tui.py'
      - '.github/workflows/test-reminiscent-ui42-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration-structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify 14 independent active switches and 14 edit selections
        run: |
          python REMINISCENT_MPC/LAB23/tests/test_ui42_integrated_tui.py --tui REMINISCENT_MPC/LAB23/skins/TUI.json

      - name: Export verified active TUI for private asset assembly
        uses: actions/upload-artifact@v4
        with:
          name: reminiscent-active-tui-${{ github.sha }}
          path: REMINISCENT_MPC/LAB23/skins/TUI.json
          retention-days: 7
