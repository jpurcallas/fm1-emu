name: BIOMECH3 native musical CPU0-CPU1 3+3
on:
  push:
    branches: [experiment/biomech-rhythm-3-dualcore-3plus3-20261023]
    paths:
      - 'experiments/biomech-rhythm-3/musical-3plus3/**'
      - '.github/workflows/biomech3-musical-3plus3-native.yml'
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: GCC/Clang long-form active slot parity and CPU1 fallback
        shell: bash
        run: bash experiments/biomech-rhythm-3/musical-3plus3/verify_active_slots_host.sh
      - name: Install verified vendor PI32v2 toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 2 --connect-timeout 15 --max-time 180 https://pkgman.jieliapp.com/s/linux-toolchain -o /tmp/jieli.tar.xz
          echo 'a1545cddbc451a06bac43eb5cd96d831470c42a97c5c0b1f98879a20fc7647bd  /tmp/jieli.tar.xz' | sha256sum -c
          mkdir -p /tmp/jieli
          tar -xJf /tmp/jieli.tar.xz -C /tmp/jieli --strip-components=1
      - name: Compile native six-track musical engine and custom CPU1 runtime
        shell: bash
        run: |
          set -euo pipefail
          S=experiments/biomech-rhythm-3/musical-3plus3
          T=/tmp/jieli/pi32v2/bin
          L=/tmp/jieli/pi32v2/lib/r3
          O=/tmp/biomech3-music
          mkdir -p "$O"
          CFLAGS='-target pi32v2 -I/tmp/jieli/pi32v2/include -mcpu=r3 -mfprev1 -ffp-contract=off -O2 -ffreestanding -fno-builtin -ffunction-sections -fdata-sections -DBR3_DUAL_CORE -DBR3_PI32V2'
          "$T/clang" -target pi32v2 -mcpu=r3 -c "$S/linkcheck_entry.S" -o "$O/cpu0_entry.o"
          "$T/clang" -target pi32v2 -mcpu=r3 -c "$S/br3_cpu1_entry.S" -o "$O/cpu1_entry.o"
          for file in biomech br3_cpu1_runtime br3_blackbox linkcheck_main; do
            "$T/clang" $CFLAGS -I"$S" -c "$S/$file.c" -o "$O/$file.o"
          done
          "$T/ld" --gc-sections -T "$S/linkcheck.ld" -e _start             "$O/cpu0_entry.o" "$O/cpu1_entry.o" "$O/biomech.o" "$O/br3_cpu1_runtime.o"             "$O/br3_blackbox.o" "$O/linkcheck_main.o"             --start-group "$L/libm.a" "$L/libc.a" "$L/libcompiler_rt.a" --end-group             -o "$O/br3_music.elf"
          /tmp/jieli/common/bin/objcopy -O binary -j .text "$O/br3_music.elf" "$O/text.bin"
          /tmp/jieli/common/bin/objcopy -O binary -j .data "$O/br3_music.elf" "$O/data.bin"
          "$T/nm" "$O/br3_music.elf" > "$O/br3_music.nm"
          "$T/size" "$O/br3_music.elf" || true
          python3 - "$O" <<'PY'
          import pathlib,sys,re,struct
          root=pathlib.Path(sys.argv[1])
          syms=root.joinpath('br3_music.nm').read_text()
          def symbol(name):
              hit=re.search(r'^([0-9a-fA-F]+)\s+\w\s+'+name+r'$',syms,re.M)
              if not hit: raise SystemExit('Missing symbol '+name)
              return int(hit[1],16)
          text=root.joinpath('text.bin').read_bytes()
          data=root.joinpath('data.bin').read_bytes()
          offset=symbol('_data_load')-0x02000120
          if offset<len(text):raise SystemExit('ROM section overlap')
          image=text+b'\xff'*(offset-len(text))+data
          if len(image)>0x8DFBC:raise SystemExit('XIP app overflow')
          if symbol('_bss_end')>0x01C74000:raise SystemExit('SRAM overflow / stacks')
          assert image[:4]==bytes.fromhex('04818000'),image[:8].hex()
          root.joinpath('br3_music.bin').write_bytes(image)
          print('BR3_MUSIC_IMAGE',len(image),'BSS_END',hex(symbol('_bss_end')),'DSP_ENGINE',hex(symbol('br_render')))
          PY
          sha256sum "$O/br3_music.bin"
      - name: Compile unmodified serial PI32v2 musical reference
        shell: bash
        run: |
          set -euo pipefail
          S=experiments/biomech-rhythm-3/musical-3plus3
          T=/tmp/jieli/pi32v2/bin
          L=/tmp/jieli/pi32v2/lib/r3
          O=/tmp/biomech3-music
          CFLAGS='-target pi32v2 -I/tmp/jieli/pi32v2/include -mcpu=r3 -mfprev1 -ffp-contract=off -O2 -ffreestanding -fno-builtin -ffunction-sections -fdata-sections -DBR3_SERIAL_REFERENCE'
          "$T/clang" $CFLAGS -I"$S/reference" -c "$S/reference/biomech.c" -o "$O/serial_engine.o"
          "$T/clang" $CFLAGS -I"$S" -c "$S/linkcheck_main.c" -o "$O/serial_main.o"
          "$T/ld" --gc-sections -T "$S/linkcheck.ld" -e _start "$O/cpu0_entry.o" "$O/serial_engine.o" "$O/serial_main.o" --start-group "$L/libm.a" "$L/libc.a" "$L/libcompiler_rt.a" --end-group -o "$O/serial_music.elf"
          /tmp/jieli/common/bin/objcopy -O binary -j .text "$O/serial_music.elf" "$O/serial_text.bin"
          /tmp/jieli/common/bin/objcopy -O binary -j .data "$O/serial_music.elf" "$O/serial_data.bin"
          "$T/nm" "$O/serial_music.elf" > "$O/serial_music.nm"
          python3 - "$O" <<'PY'
          import pathlib,sys
          root=pathlib.Path(sys.argv[1])
          lines=root.joinpath('serial_music.nm').read_text().splitlines()
          def symbol(n):
              for line in lines:
                  fields=line.split()
                  if len(fields)==3 and fields[2]==n:return int(fields[0],16)
              raise ValueError('Missing '+n)
          text=root.joinpath('serial_text.bin').read_bytes()
          data=root.joinpath('serial_data.bin').read_bytes()
          offset=symbol('_data_load')-0x02000120
          assert offset>=len(text) and symbol('_bss_end')<0x01C74000
          image=text+bytes([255])*(offset-len(text))+data
          assert len(image)<=0x8DFBC and image[:4]==bytes.fromhex('04818000')
          root.joinpath('serial_music.bin').write_bytes(image)
          print('BR3_SERIAL_MUSIC_IMAGE',len(image))
          PY
          sha256sum "$O/serial_music.bin"
      - name: Execute native musical 3+3 on actual emulated CPU0 and CPU1
        shell: bash
        run: |
          set -euo pipefail
          O=/tmp/biomech3-music
          curl -fLsS --retry 2 --connect-timeout 15 --max-time 90 https://jpurcallas.github.io/fm1-emu/biomech-blackbox/fm1_web.wasm -o "$O/fm1_web.wasm"
          node experiments/biomech-rhythm-3/musical-3plus3/smoke_native.mjs "$O/br3_music.bin" "$O/br3_music.nm" "$O/fm1_web.wasm"
          node experiments/biomech-rhythm-3/musical-3plus3/compare_native.mjs "$O/serial_music.bin" "$O/serial_music.nm" "$O/br3_music.bin" "$O/br3_music.nm" "$O/fm1_web.wasm"
      - name: Verify alternate guest PI32 16/8 frame slices against serial PCM
        shell: bash
        run: bash experiments/biomech-rhythm-3/musical-3plus3/verify_batch_pi32.sh
      - name: Compare true PI32 CPU1 full BLACK BOX vs sampled trace overhead
        shell: bash
        run: bash experiments/biomech-rhythm-3/musical-3plus3/verify_trace_sampling_pi32.sh
      - name: Compare alternative 3+3 track scheduling at same PCM
        shell: bash
        run: bash experiments/biomech-rhythm-3/musical-3plus3/verify_trackmask_pi32.sh
      - name: Diagnostic 64/128 sample work granularity and native memory
        shell: bash
        run: bash experiments/biomech-rhythm-3/musical-3plus3/verify_large_slices_pi32.sh
      - name: Profile native CPU0 prep/submit/voices/wait/mix versus CPU1 work
        shell: bash
        run: bash experiments/biomech-rhythm-3/musical-3plus3/verify_phase_profile_pi32.sh
      - name: Test 64-slot pool with active-voice traversal against original PCM and CPU effort
        shell: bash
        run: bash experiments/biomech-rhythm-3/musical-3plus3/verify_active_slots_pi32.sh
      - uses: actions/upload-artifact@v4
        with:
          name: BIOMECH3_MUSICAL_CPU1_NATIVE_PROOF_NO_INSTALL
          path: |
            /tmp/biomech3-music/br3_music.bin
            /tmp/biomech3-music/br3_music.elf
            /tmp/biomech3-music/br3_music.nm
          retention-days: 14
