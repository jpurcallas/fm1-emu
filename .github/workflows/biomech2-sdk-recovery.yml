name: BIOMECH 2 recover official V14 SDK (NO MERGE)
on:
  pull_request:
    paths:
      - '.github/workflows/biomech2-sdk-recovery.yml'
      - 'experiments/biomech-rhythm-2/**'
permissions:
  contents: read
jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch official M-VAVE Open V14 source and binary SDK
        run: |
          git clone --depth 1 https://github.com/m-vave/fm1_open.git official
          python3 - <<'PY'
          import os,hashlib
          from pathlib import Path
          path=Path('official/sdk/lib/libfm1_engine.a')
          assert path.is_file() and path.stat().st_size>1000000, 'missing official binary SDK engine'
          print('Official SDK engine',path.stat().st_size,'SHA256',hashlib.sha256(path.read_bytes()).hexdigest())
          PY
      - name: Upload official SDK source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: biomech2-official-v14-source-sdk-no-install
          path: |
            official/sdk
            official/app
            official/tools
            official/build.bat
            official/README.md
            official/THIRD_PARTY.md
            official/LICENSE.md
          retention-days: 2
