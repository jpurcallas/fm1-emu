name: REminiSCENT UI40 three-zone bar generator
on:
  pull_request:
    paths:
      - 'REMINISCENT_MPC/LAB23/tools/ui40_build_approved_three_zone_bars.py'
      - 'REMINISCENT_MPC/LAB23/tests/test_ui40_three_zone_bars.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui40-generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install asset generation dependency
        run: python -m pip install 'Pillow>=10,<13'
      - name: Preserve single-use source contract
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('REMINISCENT_MPC/LAB23/tools/ui40_build_approved_three_zone_bars.py').read_text()
          assert 'MEMORY_EDIT_' in s
          assert 'def generate(' in s
          print('PASS: UI40 generator remains available for rebuilding original-approved private skin; UI42 integration has its own test')
          PY
