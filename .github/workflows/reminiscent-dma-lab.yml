name: REMINISCENT DMA lab artifact (diagnostic only)
on:
  pull_request:
    paths:
      - 'crates/fm1-soc/src/lib.rs'
      - 'crates/fm1-web/src/lib.rs'
      - 'web/dma_probe_bench.mjs'
      - '.github/workflows/reminiscent-dma-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Build instrumented WASM
        run: web/build.sh _site
      - name: Validate diagnostic exports
        run: |
          node --input-type=module -e 'import {readFileSync} from "node:fs"; const m=new WebAssembly.Module(readFileSync("_site/fm1_web.wasm")); const names=WebAssembly.Module.exports(m).map(x=>x.name); for(const n of ["fm1_dma_probe","fm1_dma_report","fm1_render"]) if(!names.includes(n)) throw Error("Missing "+n); console.log("DMA export validation PASS");'
      - uses: actions/upload-artifact@v4
        with:
          name: reminiscent-dma-instrumented-wasm
          path: _site/fm1_web.wasm
          retention-days: 3
