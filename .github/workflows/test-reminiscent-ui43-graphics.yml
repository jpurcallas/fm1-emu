name: REminiSCENT UI43 RADAR + GRANULAR four Q-Link layers
on:
  pull_request:
    paths:
      - 'REMINISCENT_MPC/LAB23/skins/TUI.json'
      - 'REMINISCENT_MPC/LAB23/tools/ui43_generate_representative_graphics.py'
      - 'REMINISCENT_MPC/LAB23/tests/test_ui43_representative_graphics.py'
      - '.github/workflows/test-reminiscent-ui43-graphics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui43-native-layer-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Rebuild native skin from synthetic reference, check all 8 parameters and 16 frames each
        run: python REMINISCENT_MPC/LAB23/tests/test_ui43_representative_graphics.py
