name: BIOMECH3 V14 MIDI blackbox stimulus (NO INSTALL)
on:
  push:
    branches: [experiment/biomech3-v14-musical-blackbox-20261023]
    paths:
      - 'experiments/biomech-rhythm-3/sdk-v14/**'
      - '.github/workflows/biomech3-v14-full-musical-fwsc.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrated:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve exact original V14 and verified JieLi PI32
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --connect-timeout 15 --max-time 180 -o /tmp/v14.zip https://github.com/m-vave/fm1_open/archive/4d266850f8a46bd5154a0d495c1f60317156c9f7.zip
          mkdir -p /tmp/v14
          unzip -q /tmp/v14.zip -d /tmp/v14
          mv /tmp/v14/fm1_open-* /tmp/fm1-v14
          curl -fLsS --retry 3 --connect-timeout 15 --max-time 240 -o /tmp/jieli.tar.xz https://pkgman.jieliapp.com/s/linux-toolchain
          echo 'a1545cddbc451a06bac43eb5cd96d831470c42a97c5c0b1f98879a20fc7647bd  /tmp/jieli.tar.xz' | sha256sum -c
          mkdir -p /tmp/jieli
          tar -xJf /tmp/jieli.tar.xz -C /tmp/jieli --strip-components=1
      - name: Original V14 full stock 65-file SHA gate
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/biomech-rhythm-3/sdk-v14/build_v14_base.py /tmp/fm1-v14 /tmp/jieli /tmp/br3-v14-stock
      - name: Reconstruct original BIOMECH V14 adapter, preserve SDK originals
        shell: bash
        run: |
          set -euo pipefail
          BR3_DISPLAY_CACHE_SHADOW=1 BR3_AUDIO_START_PROBE=1 python3 experiments/biomech-rhythm-3/sdk-v14/stage_adapter_v04.py /tmp/fm1-v14 "$GITHUB_WORKSPACE"
      - name: Print musical control mapping from pinned original adapter
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('/tmp/fm1-v14/app/biomech/biomech_sdk_port.c')
          rows=p.read_text().splitlines()
          sel=[]
          for i,line in enumerate(rows):
              if re.search(r'PLAY|STOP|TRANSPORT|MIDI|KEY_|key_id|case 3[0-9]|case 4[0-9]|br_start\(|br_stop\(|br_midi_byte|biomech_sdk_key|biomech_sdk_midi',line,re.I):
                  sel.extend(range(max(0,i-1),min(len(rows),i+2)))
          for i in sorted(set(sel))[:190]:
              print('BR3_ADAPTER_CONTROL',i+1,rows[i][:190])
          for i in range(145,min(274,len(rows))):
              print('BR3_ADAPTER_AUDIO_PATH',i+1,rows[i][:190])
          for target in ('app/audio_output.c','app/board/audio.c','app/midi_router.c'):
              f=Path('/tmp/fm1-v14')/target
              lines=f.read_text().splitlines()
              select=set()
              for j,line in enumerate(lines):
                  if re.search(r'biomech_sdk|fm1_audio_start|FM1_MIDI_DIN',line,re.I):
                      select.update(range(max(0,j-3),min(len(lines),j+5)))
              for j in sorted(select)[:160]:
                  print('BR3_ROUTING',target,j+1,lines[j][:190])
          PY
      - name: Compile and link ALL BIOMECH musical, UI and DMA sources
        shell: bash
        run: |
          set -euo pipefail
          BR3_FULL_V14=1 python3 experiments/biomech-rhythm-3/sdk-v14/build_v14_base.py /tmp/fm1-v14 /tmp/jieli /tmp/br3-v14-full
          /tmp/jieli/pi32v2/bin/nm -n /tmp/br3-v14-full/sdk.elf > /tmp/br3-v14-full/sdk.nm
          grep -E 'biomech_sdk_init$|biomech_sdk_audio$|br_render$|br3_cpu1_main$|fm1_audio_irq$' /tmp/br3-v14-full/sdk.nm
          echo 'BIOMECH3 V14 FULL LINKED; NO CPU1 LEASE PROVEN; NOT INSTALLABLE'
      - name: Try smaller 8-frame scratch after 16-frame full link
        shell: bash
        run: |
          set -euo pipefail
          BR3_FULL_V14=1 BR3_FULL_SLICE_FRAMES=8 python3 experiments/biomech-rhythm-3/sdk-v14/build_v14_base.py /tmp/fm1-v14 /tmp/jieli /tmp/br3-v14-full-8
          /tmp/jieli/pi32v2/bin/nm -n /tmp/br3-v14-full-8/sdk.elf > /tmp/br3-v14-full-8/sdk.nm
      - name: Linker budget and symbol differential
        shell: bash
        run: |
          set -euo pipefail
          /tmp/jieli/pi32v2/bin/nm -n /tmp/br3-v14-stock/sdk.elf > /tmp/br3-v14-stock/sdk.nm
          python3 - <<'PY'
          import pathlib
          def symbols(path):
            out={}
            for line in pathlib.Path(path).read_text().splitlines():
              a=line.split()
              if len(a)==3:
                try:out[a[2]]=int(a[0],16)
                except ValueError:pass
            return out
          stock=symbols('/tmp/br3-v14-stock/sdk.nm')
          full=symbols('/tmp/br3-v14-full/sdk.nm')
          eight=symbols('/tmp/br3-v14-full-8/sdk.nm')
          for name in ('_MALLOC_SIZE','_HEAP_BEGIN','_HEAP_END','br3_seg','br3_mailbox','br3_blackbox'):
            print('BR3_FULL_V14_LINK_BUDGET',name,'stock',hex(stock[name]) if name in stock else None,'full',hex(full[name]) if name in full else None)
          if '_MALLOC_SIZE' in full:
            print('BR3_FULL_V14_48KiB_MIN',full['_MALLOC_SIZE']>=49152)
          if '_MALLOC_SIZE' in eight:
            print('BR3_FULL_V14_8FRAMES_HEAP',eight['_MALLOC_SIZE'],
                  'passes_48KiB',eight['_MALLOC_SIZE']>=49152)
          PY
      - name: Package full V14 with sixteen-frame DSP and relocated UI mirror
        shell: bash
        run: |
          set -euo pipefail
          pwsh -NoProfile -File experiments/biomech-rhythm-3/sdk-v14/pack_v14_emulator.ps1 -SdkRoot /tmp/fm1-v14 -Toolchain /tmp/jieli -BuildRoot /tmp/br3-v14-full
          mv /tmp/br3-v14-full/BIOMECH3_v0.4_CPU1_PROBE_SOLO_EMULADOR.fwsc /tmp/br3-v14-full/BIOMECH3_v0.4_CACHE_SHADOW_16F_SOLO_EMULADOR.fwsc
          sha256sum /tmp/br3-v14-full/BIOMECH3_v0.4_CACHE_SHADOW_16F_SOLO_EMULADOR.fwsc
      - name: Package experimental eight-frame V14 into real emulator FWSC
        shell: bash
        run: |
          set -euo pipefail
          command -v pwsh
          pwsh -NoProfile -File experiments/biomech-rhythm-3/sdk-v14/pack_v14_emulator.ps1 -SdkRoot /tmp/fm1-v14 -Toolchain /tmp/jieli -BuildRoot /tmp/br3-v14-full-8
          sha256sum /tmp/br3-v14-full-8/BIOMECH3_v0.4_CPU1_PROBE_SOLO_EMULADOR.fwsc
      - name: Build stock V14 FWSC using EXACT SAME experimental packaging pipeline
        shell: bash
        run: |
          set -euo pipefail
          pwsh -NoProfile -File experiments/biomech-rhythm-3/sdk-v14/pack_v14_emulator.ps1 -SdkRoot /tmp/fm1-v14 -Toolchain /tmp/jieli -BuildRoot /tmp/br3-v14-stock
          mv /tmp/br3-v14-stock/BIOMECH3_v0.4_CPU1_PROBE_SOLO_EMULADOR.fwsc /tmp/br3-v14-stock/V14_STOCK_SAME_PIPELINE_CONTROL_SOLO_EMULADOR.fwsc
          sha256sum /tmp/br3-v14-stock/V14_STOCK_SAME_PIPELINE_CONTROL_SOLO_EMULADOR.fwsc
      - name: Boot actual stock and BIOMECH3 16F FWSC on emulator with BLACK BOX
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --connect-timeout 15 --max-time 90 \
            https://jpurcallas.github.io/fm1-emu/biomech-blackbox/fm1_web.wasm -o /tmp/biomech3-fm1-web.wasm
          BR3_SMOKE=1 node experiments/biomech-rhythm-3/sdk-v14/smoke_fwsc_blackbox.mjs \
            /tmp/biomech3-fm1-web.wasm \
            /tmp/br3-v14-stock/V14_STOCK_SAME_PIPELINE_CONTROL_SOLO_EMULADOR.fwsc \
            /tmp/br3-v14-full/BIOMECH3_v0.4_CACHE_SHADOW_16F_SOLO_EMULADOR.fwsc
      - name: Stimulate real V14 FWSC with MIDI and inspect PCM WAV BLACK BOX
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/br3-v14-full/musical
          node experiments/biomech-rhythm-3/sdk-v14/smoke_fwsc_musical.mjs \
            /tmp/biomech3-fm1-web.wasm \
            /tmp/br3-v14-stock/V14_STOCK_SAME_PIPELINE_CONTROL_SOLO_EMULADOR.fwsc \
            /tmp/br3-v14-full/BIOMECH3_v0.4_CACHE_SHADOW_16F_SOLO_EMULADOR.fwsc \
            /tmp/br3-v14-full/musical /tmp/br3-v14-full/sdk.nm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BIOMECH3_V14_FULL_LINK_EXPERIMENTAL_NO_INSTALL
          path: |
            /tmp/br3-v14-stock/build.log
            /tmp/br3-v14-stock/V14_STOCK_SAME_PIPELINE_CONTROL_SOLO_EMULADOR.fwsc
            /tmp/br3-v14-full/build.log
            /tmp/br3-v14-full/sdk.elf
            /tmp/br3-v14-full/sdk.map
            /tmp/br3-v14-full/sdk.nm
            /tmp/br3-v14-full/musical/*.json
            /tmp/br3-v14-full/musical/*.wav
            /tmp/br3-v14-full/BIOMECH3_v0.4_CACHE_SHADOW_16F_SOLO_EMULADOR.fwsc
            /tmp/br3-v14-full-8/build.log
            /tmp/br3-v14-full-8/sdk.elf
            /tmp/br3-v14-full-8/sdk.map
            /tmp/br3-v14-full-8/sdk.nm
            /tmp/br3-v14-full-8/BIOMECH3_v0.4_CPU1_PROBE_SOLO_EMULADOR.fwsc
          if-no-files-found: warn
          retention-days: 14
